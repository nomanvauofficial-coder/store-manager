name: Keep database awake

# Supabase free projects are paused after 7 days without activity (e.g. a long holiday).
# (the key below is the public "anon" key, safe to keep here)
# This sends a tiny request every 2 days so the app is always ready when the shop opens again.

on:
  schedule:
    - cron: "17 3 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        run: |
          curl -fsS "https://fobesdykkmsdyhbpvzoe.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvYmVzZHlra21zZHloYnB2em9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzE1NjEsImV4cCI6MjEwOTcwNzU2MX0.fjFfPUh2nj8Z_NZScCP8SRqg0Mr3Qcdy-u-oRS1AynM" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZvYmVzZHlra21zZHloYnB2em9lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQxMzE1NjEsImV4cCI6MjEwOTcwNzU2MX0.fjFfPUh2nj8Z_NZScCP8SRqg0Mr3Qcdy-u-oRS1AynM" \
            -o /dev/null -w "database answered: %{http_code}\n"
